<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本が開いて路地へ（試作）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Righteous&family=DotGothic16&display=swap">
<style>html,body{margin:0;height:100%;background:#05030a;overflow:hidden}canvas{display:block}#fade{position:fixed;inset:0;background:#0a0610;opacity:0;pointer-events:none}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body><div id="fade"></div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { buildDiorama } from '../js/scene/diorama.js';
import { buildAlleyPaper } from '../js/scene/alleypaper.js';
try { await Promise.all(['40px "Dela Gothic One"', '40px "Righteous"', '40px "DotGothic16"'].map(f => document.fonts.load(f))); } catch {}
const Q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.append(renderer.domElement);
const cam = new THREE.PerspectiveCamera(56, innerWidth / innerHeight, 0.005, 30);
const D = await buildDiorama();
const A = await buildAlleyPaper();
const comp = new EffectComposer(renderer);
const rp = new RenderPass(D.scene, cam); comp.addPass(rp);
comp.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.75, 0.65, 0.88));
comp.addPass(new OutputPass());

// ---- 飛び出す準備：立っているものを集める ----
const pops = [];
const flatOrSmall = o => { const b = new THREE.Box3().setFromObject(o); return (b.max.y - b.min.y) < 0.04; };
for (const sd of [-1, 1]) for (const o of D.sides[sd].inner.children) pops.push(o);
for (const o of D.scene.children) { if (o === D.sides[-1].outer || o === D.sides[1].outer || o.isLight || flatOrSmall(o)) continue; pops.push(o); }
const base = new Map(pops.map(o => [o, o.scale.clone()]));
// 遅れ：奥・中央から先に、手前・外へ
const delayOf = o => { const p = new THREE.Vector3(); o.getWorldPosition(p); return Math.max(0, (p.z + 0.9) * 0.9 + Math.abs(p.x) * 0.6); };
const delays = new Map(pops.map(o => [o, delayOf(o)]));
const backOut = x => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; };
const setPop = t => { for (const o of pops) { const x = Math.min(1, Math.max(0, (t - delays.get(o)) / 0.55)); const k = x <= 0 ? 0.0001 : backOut(x); const s0 = base.get(o); o.scale.set(s0.x, s0.y * k, s0.z); o.visible = x > 0; } };
setPop(0);
// 本の表紙（右半分が閉じた状態から開く）
const coverPivot = new THREE.Group(); coverPivot.position.set(0, -0.02, 0);
const cover = new THREE.Mesh(new THREE.BoxGeometry(1.16, 0.022, 1.62), new THREE.MeshStandardMaterial({ color: '#5a1424', roughness: 0.8 }));
cover.position.x = 0.58; coverPivot.add(cover);
const deco = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 1.3), new THREE.MeshStandardMaterial({ color: '#c8a24a', metalness: 0.6, roughness: 0.4, transparent: true, opacity: 0.25 })); deco.rotation.x = -Math.PI / 2; deco.position.set(0.58, 0.012, 0); coverPivot.add(deco);
D.scene.add(coverPivot);
// 机のスタンドの明かり（最初だけ。街が立ち上がると夜になる）
const lamp = new THREE.SpotLight('#ffd8a0', 8, 6, 0.6, 0.6, 1.2); lamp.position.set(-0.8, 2.2, 1.4); lamp.target.position.set(0, 0, 0); D.scene.add(lamp, lamp.target);

// ---- カメラの道すじ ----
const K = [ // [時刻, 位置, 注視点, fov]
  [0.0, [0.9, 2.4, 2.6], [0, 0, 0], 40],
  [2.2, [0.2, 1.3, 2.0], [0, 0.1, 0], 44],
  [5.2, [0, 0.14, 1.12], [0, 0.34, -0.5], 56],
  [7.2, [0, 0.12, 0.85], [0, 0.32, -0.5], 56],
  [9.4, [0, 0.07, 0.2], [0, 0.28, -0.72], 60],
  [10.6, [0, 0.12, -0.35], [0, 0.6, -0.72], 66],
];
const ease = t => t * t * (3 - 2 * t);
function camAt(t, keys) {
  let i = 0; while (i < keys.length - 2 && t > keys[i + 1][0]) i++;
  const [t0, p0, l0, f0] = keys[i], [t1, p1, l1, f1] = keys[i + 1];
  const u = ease(Math.min(1, Math.max(0, (t - t0) / (t1 - t0))));
  const lerp = (a, b) => a.map((v, k) => v + (b[k] - v) * u);
  cam.position.set(...lerp(p0, p1)); cam.lookAt(new THREE.Vector3(...lerp(l0, l1))); cam.fov = f0 + (f1 - f0) * u; cam.updateProjectionMatrix();
}
const KA = [ // 路地に入ってから
  [0, [0, 0.07, 1.05], [0, 0.2, -0.9], 62],
  [2.4, [-0.01, 0.045, 0.66], [0.03, 0.3, -0.9], 58],
];
const fade = document.getElementById('fade');
const T_SWITCH = 10.6;
let scene = 'd';
function frame(t) {
  if (t < T_SWITCH) {
    renderer.toneMappingExposure = 0.8;
    coverPivot.rotation.z = Math.PI * (1 - ease(Math.min(1, Math.max(0, (t - 0.4) / 1.4))));
    coverPivot.visible = coverPivot.rotation.z > 0.02;
    setPop(t - 1.6);
    lamp.intensity = 8 * (1 - ease(Math.min(1, Math.max(0, (t - 2.0) / 2.5))));
    camAt(t, K);
    for (const u of D.ups) u && u(t, 1 / 60);
    fade.style.opacity = Math.max(0, (t - (T_SWITCH - 0.6)) / 0.6);
    if (scene !== 'd') { rp.scene = D.scene; scene = 'd'; }
  } else {
    const ta = t - T_SWITCH;
    renderer.toneMappingExposure = 0.72;
    if (scene !== 'a') { rp.scene = A.scene; scene = 'a'; }
    camAt(ta, KA);
    for (const u of A.ups) u && u(t);
    fade.style.opacity = Math.max(0, 1 - ta / 0.8);
  }
  comp.render();
}
if (Q.has('manual')) { window.__frame = frame; document.title = 'ready'; }
else if (Q.has('t')) { frame(+Q.get('t')); document.title = 'ready'; }
else {
  const t0 = performance.now();
  const loop = () => { frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop(); document.title = 'ready';
}
</script></body></html>
