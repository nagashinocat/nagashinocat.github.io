<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#556}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { addCat } from '../js/scene/creatures.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setScissorTest(true); document.body.append(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color('#99a'); sc.add(new THREE.HemisphereLight('#fff', '#667', 3));
const fl = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: '#778' })); fl.rotation.x = -Math.PI / 2; sc.add(fl);
const cat = await addCat(sc, { area: { x: [0, 0], z: [0, 0] } }); cat.group.position.set(0, 0, 0); cat.group.rotation.y = 0;
const poses = ['walk', 'sit', 'stretch', 'sleep'], ph = +(new URLSearchParams(location.search).get('ph') || 0.1);
const w = innerWidth / 4, h = innerHeight / 2;
poses.forEach((p, i) => {
  cat.debugPose(p, 1, ph); sc.updateMatrixWorld(true);
  for (const [j, pos] of [[0, [0.09, 0.02, 0.0]], [1, [0.05, 0.05, 0.07]]]) {
    const cam = new THREE.PerspectiveCamera(35, w / h, 0.001, 10); cam.position.set(...pos); cam.lookAt(0, 0.015, 0);
    r.setViewport(i * w, (1 - j) * h, w, h); r.setScissor(i * w, (1 - j) * h, w, h); r.render(sc, cam);
  }
});
document.title = 'ready';
</script></body></html>
