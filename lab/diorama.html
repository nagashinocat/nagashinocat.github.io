<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本の中のジオラマの街（試作）</title>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { paperBuilding, paperBuildingDetailed, paperTank, paperAntenna } from '../js/scene/paper.js';
import { makeSign, makeSign2, makeSign3 } from '../js/scene/signs.js';
import { groundTextures } from '../js/scene/alley.js';
import { glowTex } from '../js/scene/parts.js';
import { rng } from '../js/rng.js';
try { await Promise.all(['40px "Dela Gothic One"', '40px "Righteous"', '40px "DotGothic16"'].map(f => document.fonts.load(f))); } catch {}
const r = rng(12), ups = [];
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.8;
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0a0610');
scene.fog = new THREE.FogExp2('#1a0e2a', 0.12);
scene.add(new THREE.HemisphereLight('#4a3a7a', '#1a0c14', 0.3));
const desk = new THREE.DirectionalLight('#ffd8a8', 0.35); desk.position.set(-3, 5, 4); scene.add(desk);
const P = (c) => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
const cv = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };

// ---- 机と開いた本 ----
{
  const [c, g] = cv(512, 512); g.fillStyle = '#2a1810'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 80; i++) { g.strokeStyle = `rgba(90,55,30,${Math.random() * 0.5})`; g.lineWidth = 1 + Math.random() * 2; g.beginPath(); const y = Math.random() * 512; g.moveTo(0, y); g.bezierCurveTo(170, y + 8, 340, y - 8, 512, y + 4); g.stroke(); }
  const t = P(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4, 4);
  const d = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshStandardMaterial({ map: t, roughness: 0.7 })); d.rotation.x = -Math.PI / 2; d.position.y = -0.04; scene.add(d);
  const cover = new THREE.MeshStandardMaterial({ color: '#5a1424', roughness: 0.8 }), paper = new THREE.MeshStandardMaterial({ color: '#d8ccb4', roughness: 1 });
  for (const s of [-1, 1]) {
    const cv0 = new THREE.Mesh(new THREE.BoxGeometry(1.16, 0.02, 1.62), cover); cv0.position.set(s * 0.58, -0.03, 0); scene.add(cv0);
    const pg = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.025, 1.56), paper); pg.position.set(s * 0.56, -0.008, 0); pg.rotation.z = s * -0.015; scene.add(pg);
  }
}
// ---- 夜空の書き割り（本の奥に立つ紙）：月・雲・遠くの高層ビル群 ----
{
  const [c, g] = cv(2048, 900);
  const gr = g.createLinearGradient(0, 0, 0, 900); gr.addColorStop(0, '#060a26'); gr.addColorStop(0.6, '#1c1446'); gr.addColorStop(1, '#4a1e5a'); g.fillStyle = gr; g.fillRect(0, 0, 2048, 900);
  for (let i = 0; i < 200; i++) { g.fillStyle = `rgba(255,255,255,${Math.random()})`; g.fillRect(Math.random() * 2048, Math.random() * 400, 1.5, 1.5); }
  for (let i = 0; i < 18; i++) { const x = Math.random() * 2048, y = 80 + Math.random() * 300; const gg = g.createRadialGradient(x, y, 0, x, y, 200); gg.addColorStop(0, 'rgba(120,90,170,0.3)'); gg.addColorStop(1, 'rgba(120,90,170,0)'); g.fillStyle = gg; g.fillRect(x - 200, y - 200, 400, 400); }
  g.fillStyle = '#f4f0e0'; g.beginPath(); g.arc(1700, 120, 48, 0, 7); g.fill(); const mg = g.createRadialGradient(1700, 120, 40, 1700, 120, 170); mg.addColorStop(0, 'rgba(220,220,255,0.4)'); mg.addColorStop(1, 'rgba(220,220,255,0)'); g.fillStyle = mg; g.fillRect(1500, 0, 400, 320);
  // 遠くの摩天楼（ピンクと青のネオンの縁）
  for (let x = 0; x < 2048;) { const w = 30 + Math.random() * 70, h = 150 + Math.random() * 420, y = 900 - h; g.fillStyle = Math.random() < 0.5 ? '#16123a' : '#1e1648'; g.fillRect(x, y, w, h); const col = Math.random() < 0.5 ? '#ff4fd8' : '#4fc8ff'; g.fillStyle = col; g.fillRect(x, y, w, 3); g.fillRect(x + w / 2 - 1, y - 30, 2, 30); for (let yy = y + 10; yy < 890; yy += 12) for (let xx = x + 4; xx < x + w - 4; xx += 8) if (Math.random() < 0.35) { g.fillStyle = Math.random() < 0.7 ? 'rgba(120,180,255,0.7)' : 'rgba(255,120,220,0.7)'; g.fillRect(xx, yy, 4, 5); } x += w + Math.random() * 10; }
  const m = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.15), new THREE.MeshBasicMaterial({ map: P(c), toneMapped: false, color: new THREE.Color(0.9, 0.9, 0.9) }));
  m.position.set(0, 0.56, -0.8); scene.add(m);
}
// ---- 地面（濡れた路面と、手前の空き地） ----
{
  const gt = groundTextures(r, 2.1, 1.5);
  const top = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 1.5), new THREE.MeshStandardMaterial({ map: gt.top, transparent: true, depthWrite: false, roughness: 0.6 }));
  top.rotation.x = -Math.PI / 2; top.position.y = 0.012; scene.add(top);
  const mirror = new Reflector(new THREE.PlaneGeometry(2.1, 1.5), { textureWidth: 1024, textureHeight: 768, color: 0x9a8aa8 });
  mirror.rotation.x = -Math.PI / 2; mirror.position.y = 0.011; scene.add(mirror);
}
const AX = 0.17; // 真ん中の大通り（奥のタワーへ）の半幅
const occupied = [];
const free = (x, z, w, d) => !occupied.some(o => Math.abs(o.x - x) < (o.w + w) / 2 + 0.01 && Math.abs(o.z - z) < (o.d + d) / 2 + 0.01) && (occupied.push({ x, z, w, d }), true);
const signColors = ['#ff4fa3', '#4fd8ff', '#ffb21f', '#b46bff', '#ff3b3b', '#7cff6b'];
function dressBuilding(b, w, h, side) {
  // 壁の看板（小さく、いくつか）
  const n = r.int(1, 3);
  for (let k = 0; k < n; k++) {
    const kind = r.pick(['neon', 'lightbox', 'bulbvert', 'marquee', 'round']);
    const text = kind === 'marquee' ? 'nagashinocat' : r.pick(['猫', 'ながしの猫']);
    const size = kind === 'marquee' ? [0.01 + text.length * 0.009, 0.026] : kind === 'round' ? [0.05, 0.05] : [0.035, 0.03 + [...text].length * 0.03];
    const sg = kind === 'bulbvert' ? makeSign2(kind, text, r.pick(signColors), size, { rng: () => r.next() }) : makeSign(kind, text, r.pick(signColors), size, { vertical: size[1] > size[0], rng: () => r.next() });
    if (sg.update) ups.push(sg.update);
    sg.group.position.set(r.range(-w * 0.35, w * 0.35), r.range(0.1, h * 0.8), 0.014);
    b.add(sg.group);
  }
}
function building(x, z, w, d, h, face = 0) {
  if (!free(x, z, w, d)) return null;
  const b = (Math.abs(x) < 0.6 && z > -0.3 ? paperBuildingDetailed : paperBuilding)(w, h, d, r, { sides: false });
  b.position.set(x, 0.012, z + d / 2); b.rotation.y = face; scene.add(b);
  dressBuilding(b, w, h);
  return b;
}
// ---- 奥の大タワー（横長の大画面、竜のネオン、サーチライト） ----
{
  const t = paperBuilding(0.36, 1.25, 0.3, r, { sides: false }); t.position.set(0, 0.012, -0.42); scene.add(t);
  occupied.push({ x: 0, z: -0.57, w: 0.36, d: 0.3 });
  const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.17, 0.12, 8), new THREE.MeshStandardMaterial({ color: '#2a2440' })); crown.position.set(0, 1.32, -0.57); scene.add(crown);
  const spire = new THREE.Mesh(new THREE.ConeGeometry(0.012, 0.22, 6), new THREE.MeshStandardMaterial({ color: '#3a3450' })); spire.position.set(0, 1.49, -0.57); scene.add(spire);
  const [c, g] = cv(640, 360); const im = new Image(); im.src = '../assets/shots/aiaigasa.jpg'; await im.decode().catch(() => {});
  g.fillStyle = '#000'; g.fillRect(0, 0, 640, 360); if (im.naturalWidth) { const k = Math.max(640 / im.naturalWidth, 360 / im.naturalHeight); g.drawImage(im, (640 - im.naturalWidth * k) / 2, (360 - im.naturalHeight * k) / 2, im.naturalWidth * k, im.naturalHeight * k); }
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.169), new THREE.MeshBasicMaterial({ map: P(c), toneMapped: false, color: new THREE.Color(1.8, 1.8, 1.8) })); scr.position.set(0, 0.82, -0.417); scene.add(scr);
  const fr = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.189), new THREE.MeshBasicMaterial({ color: new THREE.Color(2.4, 0.6, 1.6), toneMapped: false })); fr.position.set(0, 0.82, -0.4175); scene.add(fr);
  const dragon = makeSign3('letters', '猫', '#ff3b3b', [0.1, 0.1], { rng: () => r.next() }); dragon.group.position.set(0, 1.04, -0.416); scene.add(dragon.group);
  const s = makeSign('neon', 'ながしの猫', '#ff3b6a', [0.26, 0.07], { rng: () => r.next() }); s.group.position.set(0, 1.18, -0.416); scene.add(s.group);
  const L = new THREE.PointLight('#ff6ab8', 0.5, 1.2, 2); L.position.set(0, 0.82, -0.3); scene.add(L);
  const beam = new THREE.MeshBasicMaterial({ color: '#9fd8ff', transparent: true, opacity: 0.1, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
  for (const sx of [-1, 1]) { const p = new THREE.Group(); p.position.set(sx * 0.12, 1.3, -0.57); const cn = new THREE.Mesh(new THREE.ConeGeometry(0.3, 3, 16, 1, true), beam); cn.position.y = 1.5; cn.rotation.z = Math.PI; p.add(cn); p.userData.s = sx; scene.add(p); ups.push(t2 => { p.rotation.z = -sx * (0.35 + Math.sin(t2 * 0.5 + sx) * 0.2); }); }
}
// ---- カジノ（ド派手）：左手前の大きな建物、電球の看板・ネオンの人形・追いかける縁 ----
{
  const x = -0.62, z = 0.02, w = 0.42, d = 0.28, h = 0.34;
  occupied.push({ x, z: z + d / 2 - d / 2, w, d });
  const b = paperBuilding(w, h, d, r, { sides: false, palette: '#6a2a3a' }); b.position.set(x, 0.012, z + d / 2); b.rotation.y = 0.35; scene.add(b);
  const ca = makeSign('marquee', 'nagashinocat', '#ff3b3b', [0.34, 0.08], { rng: () => r.next() }); ca.group.position.set(0, h * 0.62, 0.02); b.add(ca.group); ups.push(ca.update);
  const lucky = makeSign2('bulbvert', '猫', '#ffb21f', [0.06, 0.2], { rng: () => r.next() }); lucky.group.position.set(w * 0.42, h + 0.08, 0.0); b.add(lucky.group); if (lucky.update) ups.push(lucky.update);
  const star = makeSign2('neonicon', 'star', '#ffe84a', [0.1, 0.1], { rng: () => r.next() }); star.group.position.set(-w * 0.3, h + 0.07, 0); b.add(star.group); if (star.update) ups.push(star.update);
  const cat = makeSign2('neonicon', 'cat', '#ff4fa3', [0.09, 0.09], { rng: () => r.next() }); cat.group.position.set(-w * 0.05, h + 0.06, 0); b.add(cat.group); if (cat.update) ups.push(cat.update);
  const led = makeSign3('led', 'nagashinocat ★ ながしの猫 ★ 猫', '#ff3b3b', [0.36, 0.024], { rng: () => r.next() }); led.group.position.set(0, h * 0.35, 0.016); b.add(led.group); ups.push(led.update);
  // 庇の下の電球の列
  const bulbs = new THREE.InstancedMesh(new THREE.SphereGeometry(0.0035, 6, 4), new THREE.MeshBasicMaterial({ color: '#fff2b0', toneMapped: false }), 60);
  const M = new THREE.Matrix4(); for (let i = 0; i < 60; i++) { M.makeTranslation(-w / 2 + (i % 30) / 29 * w, 0.08 + Math.floor(i / 30) * 0.012, 0.03); bulbs.setMatrixAt(i, M); } b.add(bulbs);
  const L = new THREE.PointLight('#ff5a3a', 0.4, 0.8, 2); L.position.set(x + 0.05, 0.15, z + 0.4); scene.add(L);
}
// ---- 右手前：ホテルと屋上のビルボード ----
{
  const x = 0.6, z = 0.04, w = 0.34, d = 0.26, h = 0.62;
  occupied.push({ x, z, w, d });
  const b = paperBuilding(w, h, d, r, { sides: false }); b.position.set(x, 0.012, z + d / 2); b.rotation.y = -0.35; scene.add(b);
  const ho = makeSign3('letters', 'nagashinocat', '#4fd8ff', [0.3, 0.05], { rng: () => r.next() }); ho.group.position.set(0, h + 0.05, 0); b.add(ho.group);
  const v = makeSign('neon', 'ながしの猫', '#ff4fa3', [0.06, 0.3], { vertical: true, rng: () => r.next() }); v.group.position.set(w * 0.4, h * 0.55, 0.04); b.add(v.group); if (v.update) ups.push(v.update);
  const L = new THREE.PointLight('#4fd8ff', 0.3, 0.7, 2); L.position.set(x - 0.05, 0.3, z + 0.35); scene.add(L);
}
// ---- 九龍城の塊：大通りの両側にぎっしり ----
for (const side of [-1, 1]) {
  for (let row = 0; row < 7; row++) {
    const z = -0.62 + row * 0.15;
    let x = side * (AX + 0.02);
    for (let k = 0; k < 6; k++) {
      const w = r.range(0.1, 0.2), d = r.range(0.1, 0.16);
      const cx = x + side * w / 2;
      if (Math.abs(cx) > 1.0) break;
      const near = z > 0.15;
      const h = near ? r.range(0.18, 0.4) : r.range(0.35, 0.85) * (1 - Math.abs(cx) * 0.35);
      const b = building(cx, z, w, d, h, side * (row > 3 ? 0.08 : 0));
      if (b && r.next() < 0.5) { const t = paperTank(r); t.position.set(r.range(-w * 0.3, w * 0.3), h, -d * 0.5); b.add(t); }
      if (b) for (let q = 0; q < r.int(0, 2); q++) { const a = paperAntenna(r); a.scale.setScalar(1.8); a.position.set(r.range(-w * 0.4, w * 0.4), h, -d * r.range(0.2, 0.8)); b.add(a); }
      x += side * (w + r.range(0, 0.012));
    }
  }
}
// ---- 高架の高速道路（左右の端）と車の光 ----
{
  const deckM = new THREE.MeshStandardMaterial({ color: '#2a2436', roughness: 0.9 });
  for (const side of [-1, 1]) {
    const road = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.012, 1.4), deckM); road.position.set(side * 0.98, 0.3, -0.05); scene.add(road);
    for (let z = -0.7; z <= 0.6; z += 0.22) { const leg = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.3, 0.02), deckM); leg.position.set(side * 0.98, 0.15, z); scene.add(leg); }
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.004, 0.004, 1.4), new THREE.MeshBasicMaterial({ color: new THREE.Color(2.5, 0.8, 2.2), toneMapped: false })); rail.position.set(side * (0.98 - 0.03), 0.312, -0.05); scene.add(rail);
    const cars = new THREE.InstancedMesh(new THREE.BoxGeometry(0.008, 0.004, 0.014), new THREE.MeshBasicMaterial({ toneMapped: false }), 14);
    const list = Array.from({ length: 14 }, (_, i) => ({ z: r.range(-0.75, 0.65), v: (i % 2 ? 1 : -1) * r.range(0.1, 0.2), lane: i % 2 ? 0.012 : -0.012 }));
    list.forEach((c, i) => cars.setColorAt(i, new THREE.Color(c.v > 0 ? '#fff0c0' : '#ff4040').multiplyScalar(2)));
    scene.add(cars);
    ups.push((t, dt = 1 / 60) => { const M = new THREE.Matrix4(); list.forEach((c, i) => { c.z += c.v * dt; if (c.z > 0.65) c.z = -0.75; if (c.z < -0.75) c.z = 0.65; M.makeTranslation(side * 0.98 + c.lane, 0.31, c.z); cars.setMatrixAt(i, M); }); cars.instanceMatrix.needsUpdate = true; });
  }
}
// ---- 手前の空き地：金網・ドラム缶・壊れた木材・雑草 ----
{
  const [c, g] = cv(64, 64); g.strokeStyle = '#3a3438'; g.lineWidth = 3; for (let k = -64; k < 128; k += 16) { g.beginPath(); g.moveTo(k, 0); g.lineTo(k + 64, 64); g.stroke(); g.beginPath(); g.moveTo(k + 64, 0); g.lineTo(k, 64); g.stroke(); }
  const t = P(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  for (const [x, z, len, ry] of [[-0.7, 0.62, 0.5, 0.2], [0.72, 0.6, 0.45, -0.25]]) {
    const tt = t.clone(); tt.needsUpdate = true; tt.repeat.set(len * 40, 4);
    const net = new THREE.Mesh(new THREE.PlaneGeometry(len, 0.1), new THREE.MeshStandardMaterial({ map: tt, transparent: true, alphaTest: 0.3, side: THREE.DoubleSide }));
    net.position.set(x, 0.062, z); net.rotation.y = ry; net.rotation.z = r.range(-0.08, 0.08); scene.add(net);
    for (let k = -1; k <= 1; k++) { const post = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.12, 6), new THREE.MeshStandardMaterial({ color: '#4a3a30' })); post.position.set(x + Math.cos(ry) * k * len / 2, 0.06, z - Math.sin(ry) * k * len / 2); post.rotation.z = r.range(-0.15, 0.15); scene.add(post); }
  }
  for (const [x, z, col] of [[-0.5, 0.66, '#7a3a22'], [0.5, 0.68, '#3a4a6a'], [0.56, 0.7, '#6a3a22']]) { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.06, 14), new THREE.MeshStandardMaterial({ color: col, roughness: 0.8 })); b.position.set(x, 0.042, z); scene.add(b); }
  for (let i = 0; i < 6; i++) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.008, r.range(0.12, 0.25)), new THREE.MeshStandardMaterial({ color: '#5a3a22' })); p.position.set(r.pick([-1, 1]) * r.range(0.6, 0.9), 0.03, r.range(0.5, 0.7)); p.rotation.set(r.range(-0.6, 0.6), r.range(0, 3), r.range(-0.3, 0.3)); scene.add(p); }
}
// ---- 湯気 ----
{
  const [c, g] = cv(64, 64); for (let i = 0; i < 6; i++) { const x = 20 + Math.random() * 24, y = 20 + Math.random() * 24, rr = 10 + Math.random() * 10; const gr = g.createRadialGradient(x, y, 0, x, y, rr); gr.addColorStop(0, 'rgba(230,210,255,0.5)'); gr.addColorStop(1, 'rgba(230,210,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); }
  const st = P(c);
  for (let i = 0; i < 18; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: st, transparent: true, opacity: 0.35, depthWrite: false })); s.position.set(r.pick([-1, 1]) * r.range(0.2, 0.9), r.range(0.05, 0.2), r.range(-0.4, 0.4)); s.scale.setScalar(r.range(0.1, 0.25)); scene.add(s); }
}
// ---- 大通り沿いの看板の光と提灯 ----
for (let i = 0; i < 16; i++) { const side = i % 2 ? 1 : -1; const L = new THREE.PointLight(r.pick(['#ff4fa3', '#ff7a3a', '#4fd8ff', '#ffb21f']), 0.12, 0.35, 2); L.position.set(side * (AX + 0.03), r.range(0.05, 0.3), r.range(-0.4, 0.45)); scene.add(L); }

const cam = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.01, 30);
cam.position.set(0, 0.62, 2.05); cam.lookAt(0, 0.32, -0.1);
const comp = new EffectComposer(renderer);
comp.addPass(new RenderPass(scene, cam));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.8, 0.6, 0.85));
comp.addPass(new OutputPass());
for (const u of ups) u && u(0.4);
comp.render();
document.title = 'ready';
</script></body></html>
