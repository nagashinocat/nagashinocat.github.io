<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#334}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); r.setScissorTest(true); document.body.append(r.domElement);
const L = new GLTFLoader(); L.setMeshoptDecoder(MeshoptDecoder);
const views = [];
for (const [i, f] of ['cat', 'whale'].entries()) {
  const g = await L.loadAsync(`../assets/models/${f}.glb`);
  const sc = new THREE.Scene(); sc.add(new THREE.HemisphereLight('#fff', '#556', 2.5), g.scene);
  const box = new THREE.Box3().setFromObject(g.scene), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3()).length();
  console.log(f, JSON.stringify(box.min), JSON.stringify(box.max));
  for (const [j, dir] of [[0, [0, 0, 1]], [1, [1, 0, 0]], [2, [0, 1, 0.001]]].entries()) {
    const cam = new THREE.PerspectiveCamera(40, 1, 0.01, 100); cam.position.copy(c).addScaledVector(new THREE.Vector3(...dir[1]), s * 1.3); cam.lookAt(c);
    views.push([sc, cam, j, i]);
  }
}
const w = innerWidth / 3, h = innerHeight / 2;
for (const [sc, cam, j, i] of views) { r.setViewport(j * w, (1 - i) * h, w, h); r.setScissor(j * w, (1 - i) * h, w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); r.render(sc, cam); }
document.title = 'ready';
</script></body></html>
